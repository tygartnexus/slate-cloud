# Compose v2 infers the schema; the top-level `version` key is obsolete.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: slate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your local .env}
      POSTGRES_DB: slate_cloud
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    # Lets `docker compose up -d --wait postgres` block until the server can
    # actually accept connections, instead of racing `alembic upgrade head`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slate -d slate_cloud"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

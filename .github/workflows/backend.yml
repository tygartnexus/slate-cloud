name: backend

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly. CI only ran on push before, so a dependency advisory or a tool
    # release could turn the build red for months without anyone seeing it.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.10; test what we claim.
        python-version: ["3.10", "3.11", "3.12"]
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./ci_migrations.db
      CLERK_JWT_PUBLIC_KEY: test-clerk-public-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend
        run: pip install -e ".[dev]"

      - name: Format check
        run: python -m black --check .

      - name: Lint
        run: python -m ruff check app tests migrations

      - name: Type check
        run: python -m mypy app

      - name: Migration smoke
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Test (SQLite; coverage gate in pyproject)
        run: python -m pytest -v

  postgres:
    # Production runs Postgres. Exercising migrations only on SQLite hides
    # dialect differences in batch_alter_table, index DDL, and type handling.
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg2://slate:slate@localhost:5432/slate_cloud_test
      TEST_DATABASE_URL: postgresql+psycopg2://slate:slate@localhost:5432/slate_cloud_test
      CLERK_JWT_PUBLIC_KEY: test-clerk-public-key
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: slate
          POSTGRES_PASSWORD: slate
          POSTGRES_DB: slate_cloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Migrate up, down, and back up
        run: |
          python -m alembic upgrade head
          python -m alembic current
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Schema drift guard against Postgres
        run: python -m pytest tests/test_schema_drift.py -v --no-cov

  test:
    # Stable aggregate gate. Branch protection on main requires a status check
    # named exactly "test"; matrix jobs report as "test (3.10)" and friends, so
    # this job carries the required name and fails if any leg failed.
    needs: [pytest, postgres]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all backend jobs to succeed
        run: |
          echo "pytest=${{ needs.pytest.result }} postgres=${{ needs.postgres.result }}"
          test "${{ needs.pytest.result }}" = "success"
          test "${{ needs.postgres.result }}" = "success"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slate-cloud-backend"
version = "0.1.0"
description = "Backend API for Slate Cloud dashboard."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.4",
    "PyJWT[crypto]>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Lint/format/type tools are upper-bounded on purpose. They gate CI, and a new
# minor release that widens a default rule set turns the build red with no code
# change. Bump these deliberately, not implicitly.
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=5.0,<8",
    "httpx>=0.27",
    "black>=24.0,<27",
    "ruff>=0.16,<0.17",
    "mypy>=1.10,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
# Black is the formatter and owns line length; keep ruff aligned with it.
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Select explicitly. Inheriting ruff's defaults means the rule set silently
# changes underneath CI between releases.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "BLE",  # flake8-blind-except
    "RUF",  # ruff-specific
]
ignore = [
    # FastAPI's dependency-injection idiom is a function call in an argument
    # default (`= Depends(...)`, `= Header(...)`, `= Query(...)`). That is the
    # documented, correct usage, not the mutable-default bug B008 targets.
    "B008",
    # Formatter owns line length.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Alembic migration templates are generated with a fixed import layout.
"migrations/versions/*" = ["I001"]
